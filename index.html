<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ISMACASHRIGHT? – UI Student Budget</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#FFFBEA;--card:#fff;--tx:#202B3C;--mut:#6b7385;--pri:#173F7A;--onpri:#fff;--y:#FFC20E;--yl:#FFF3C4;--line:#EFE6C4;--g:#2E9D68;--w:#E8A23A;--r:#D9534F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14151a;--card:#1f2128;--tx:#f1f2f5;--mut:#9aa0ae;--pri:#FFC20E;--onpri:#14151a;--yl:#3a3216;--line:#33353d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}h1,h2,h3{margin:0}
#app{display:flex;min-height:100vh}
nav.sb{display:none;width:230px;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;flex-direction:column;gap:2px;overflow:auto}
.logo{font-weight:900;font-size:19px;color:var(--pri);padding:4px 10px 14px}.logo span{background:var(--y);color:#173F7A;padding:1px 6px;border-radius:6px}
.ni{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:600;border:0;background:none;text-align:left;width:100%}
.ni.on{background:var(--y);color:#173F7A}
main{flex:1;min-width:0;padding:16px 16px 90px;max-width:1000px;margin:auto;width:100%}
nav.bn{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bn button{flex:1;border:0;background:none;font-size:11px;font-weight:600;color:var(--mut);padding:4px}nav.bn button.on{color:var(--pri)}nav.bn b{display:block;font-size:20px}
@media(min-width:860px){nav.sb{display:flex}nav.bn{display:none}main{padding:28px 28px 40px}}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(23,63,122,.08);border:1px solid var(--line)}
.hero{background:var(--y);color:#173F7A;border:0}.hero .mut{color:#5b4a00}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mut{color:var(--mut);font-size:13px}.big{font-size:30px;font-weight:800}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.b{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}.b2{background:var(--yl);color:var(--tx);border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.hero .bar{background:rgba(23,63,122,.18)}
.pg>h2{font-size:22px;margin:4px 0 14px;color:var(--tx)}.pg>.card,.pg>.grid{margin-bottom:12px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut);font-weight:600}
.tag{display:inline-block;background:var(--yl);color:var(--tx);border-radius:8px;font-size:11px;padding:2px 8px;font-weight:700}
.demo{background:#fff3cd;color:#664d03}.ok{color:var(--g)}.wn{color:var(--w)}.er{color:var(--r)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.md{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}.md h3{margin-bottom:12px}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}.ic{width:38px;height:38px;border-radius:12px;background:var(--yl);display:grid;place-items:center;font-size:19px;flex:none}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px;margin-bottom:8px}.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}.chip.on{background:var(--y);color:#173F7A;border-color:var(--y)}
.dn{width:150px;height:150px;flex:none}.leg{font-size:13px;display:grid;gap:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.fab{position:fixed;right:16px;bottom:84px;background:var(--pri);color:var(--onpri);border:0;border-radius:99px;padding:12px 16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6;cursor:pointer}@media(min-width:860px){.fab{bottom:24px}}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;margin:6px 0;white-space:pre-line}.me{background:var(--y);color:#173F7A;margin-left:auto;border-bottom-right-radius:4px}.bot{background:var(--yl);border-bottom-left-radius:4px}
.wel{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;background:var(--y);color:#173F7A;width:100%}.wel .card{max-width:440px;width:100%;text-align:left;color:var(--tx)}
.tg{width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.tg.on{background:var(--g)}.tg.on:after{left:23px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#173F7A;color:#fff;padding:10px 18px;border-radius:12px;z-index:30}
a{color:var(--pri);font-weight:700}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),F=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID'),N=v=>Math.max(0,parseFloat(v)||0);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const off=o=>{const d=new Date();d.setDate(d.getDate()+o);return ymd(d)};
const COL=['#F5B700','#173F7A','#2F68B2','#2E9D68','#E8A23A','#D9534F','#8A6D1F','#6FA3E0','#9b59b6'];
function def(){let i=0;const t=(n,a,c,d,note)=>({id:++i,n,a:a*1000,c,d:off(-d),note:note||''});
return{on:true,name:'Ismail',campus:'Depok',living:'Kos',allow:2000000,next:off(20),fixed:100000,prot:150000,notif:{budget:1,daily:1,weekly:0},priv:{hide:1,share:0},
cats:[{id:'food',n:'Food & Drinks',i:'🍜',a:750000},{id:'tr',n:'Transportation',i:'🚌',a:250000},{id:'acc',n:'Accommodation (Kos)',i:'🏠',a:400000},{id:'aca',n:'Academic',i:'📚',a:150000},{id:'per',n:'Personal',i:'🧴',a:200000},{id:'ent',n:'Entertainment & Social',i:'🎮',a:100000},{id:'sav',n:'Savings',i:'🐷',a:150000}],
tx:[t('Nasi ayam kantin FIK',18,'food',0),t('Kopi susu',15,'food',0),t('Print laporan',15,'aca',1),t('Ojol ke stasiun',18,'tr',1),t('Warteg Kukusan',20,'food',2),t('Mie ayam',17,'food',3),t('Laundry kos',45,'acc',3),t('KRL pulang-pergi',41,'tr',4),t('GoFood malam',38,'food',5),t('Fotokopi diktat',10,'aca',5),t('Belanja mingguan',120,'food',6,'Beras, telur, mi'),t('Paket data',20,'per',7),t('Ojol hujan',25,'tr',8),t('Token listrik',100,'acc',9),t('Nonton bareng teman',15,'ent',10),t('Ayam geprek',25,'food',11),t('Makan bareng angkatan',150,'food',12,'Gathering'),t('Buku catatan',20,'aca',13),t('Ojol ke kampus',22,'tr',14),t('Nasi uduk',15,'food',14),t('Makan siang tim tugas',32,'food',15),t('Galon & sabun',55,'acc',16),t('Ojol',14,'tr',16)].map(x=>x)
,goals:[{id:1,n:'Emergency fund',t:500000,s:200000,d:off(120)},{id:2,n:'New laptop',t:5000000,s:1500000,d:off(365)},{id:3,n:'Holiday with friends',t:1000000,s:250000,d:off(200)}],
posts:[{id:1,u:'Sample: Rina (FEB)',t:'How do you survive on Rp50.000 per day?',b:'Cooking rice at the kos and buying only side dishes saves me ~Rp15.000 a day.',l:24,c:['Sample: Bagas: same, rice cooker is a lifesaver']},{id:2,u:'Sample: Dimas (FT)',t:'Tips for lowering transport costs',b:'Take Bikun on-campus and pool ojol rides with friends when going out.',l:17,c:[]},{id:3,u:'Sample: Salsa (FISIP)',t:'Rp50K Student Challenge: week 1 done',b:'Tracked everything here. Biggest leak was iced coffee!',l:31,c:[]}],liked:[]}}
// fix: transport sum
let S;try{S=JSON.parse(localStorage.getItem('imcr'))}catch(e){}S=S||def();
const save=()=>{try{localStorage.setItem('imcr',JSON.stringify(S))}catch(e){}};
const days=()=>Math.max(1,Math.ceil((new Date(S.next+'T00:00')-new Date(ymd(new Date())+'T00:00'))/864e5));
const spent=()=>S.tx.reduce((a,b)=>a+b.a,0),sp=id=>S.tx.filter(x=>x.c==id).reduce((a,b)=>a+b.a,0),rem=()=>S.allow-spent(),daily=()=>rem()/days();
const cat=id=>S.cats.find(c=>c.id==id)||{n:'Other',i:'💸'},ci=id=>Math.max(0,S.cats.findIndex(c=>c.id==id));
const spCats=()=>S.cats.filter(c=>c.id!='sav'),totAlloc=()=>S.cats.reduce((a,b)=>a+b.a,0);
const recent=()=>{const s=S.tx.filter(x=>x.d>=off(-6)).reduce((a,b)=>a+b.a,0);return s/7};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function form(title,fs,cb){const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="md"><h3>${title}</h3>${fs.map(f=>`<label>${f.l}${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${o[0]==f.v?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${f.v??''}" ${f.t=='number'?'min="0"':''}>`}</label>`).join('')}<div class="row" style="justify-content:flex-end"><button class="b2" onclick="this.closest('.ov').remove()">Cancel</button><button class="b" id="ok">Save</button></div></div>`;document.body.append(m);m.querySelector('#ok').onclick=()=>{const v={};fs.forEach(f=>v[f.k]=m.querySelector('#f_'+f.k).value);if(cb(v)!==false)m.remove()}}
const catOpts=()=>spCats().map(c=>[c.id,c.i+' '+c.n]);
function donut(it){const t=it.reduce((a,b)=>a+b.v,0)||1;let o=0;return`<svg viewBox="0 0 42 42" class="dn"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line)" stroke-width="5"/>`+it.map(i=>{const p=i.v/t*100,s=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${i.c}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-o}"/>`;o+=p;return s}).join('')+`<text x="21" y="20" text-anchor="middle" font-size="3.4" fill="var(--mut)">Spent</text><text x="21" y="24.5" text-anchor="middle" font-size="3.8" font-weight="700" fill="var(--tx)">${Math.round(t/1000)}k</text></svg>`}
const dn=()=>{const it=spCats().map(c=>({n:c.n,v:sp(c.id),c:COL[ci(c.id)%9]})).filter(x=>x.v>0);return`<div class="row" style="gap:16px">${donut(it)}<div class="leg">${it.map(i=>`<div><i style="background:${i.c}"></i>${i.n} · ${F(i.v)}</div>`).join('')}</div></div>`};
const pct=(a,b)=>b>0?Math.min(100,a/b*100):0;
function insights(){const r=[],f=cat('food'),fa=S.cats.find(c=>c.id=='food');if(fa)r.push(`🍜 You’ve spent ${Math.round(sp('food')/fa.a*100)}% of your monthly food budget.`);
const tr=S.cats.find(c=>c.id=='tr');if(tr)r.push(sp('tr')<tr.a*.6?'🚌 Nice! Your transportation spending is well within plan.':'🚌 Transport is getting close to its limit. Try Bikun or shared rides.');
spCats().filter(c=>sp(c.id)>c.a).forEach(c=>r.push(`⚠️ ${c.n} is over budget by ${F(sp(c.id)-c.a)}. Let’s adjust the remaining days.`));
const ds=daily(),rc=recent();r.push(rc>ds?`📈 Your 7-day average (${F(rc)}/day) is above your ${F(ds)} daily limit. Slow down a little.`:`💡 At your recent pace you could keep about ${F(Math.max(0,(ds-rc)*days()))} unspent by next allowance.`);return r}
// ---------- pages ----------
const P={};
P.home=()=>{const e=spent(),r=rem(),p=pct(e,S.allow);const dt=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
return`<div class="row sp" style="margin-bottom:12px"><div><h2 style="font-size:22px">Halo, ${S.name}! 👋</h2><div class="mut">${dt} · ${S.campus} campus · ${S.living}</div></div><span class="tag">Demo account</span></div>
<div class="card hero" style="margin-bottom:12px"><div class="mut">Remaining allowance</div><div class="big">${F(r)}</div><div class="bar" style="margin:10px 0 6px"><i style="width:${p}%"></i></div><div class="row sp"><span>${Math.round(p)}% of ${F(S.allow)} used</span><span>${days()} days to next allowance</span></div>
<div style="margin-top:12px;background:rgba(255,255,255,.55);padding:10px 12px;border-radius:12px"><b>Recommended spending: ${F(daily())}/day</b><div class="mut">${F(r)} ÷ ${days()} days</div></div></div>
<div class="grid g3" style="margin-bottom:12px"><div class="card"><div class="mut">Monthly allowance</div><b style="font-size:18px">${F(S.allow)}</b></div><div class="card"><div class="mut">Total expenses</div><b style="font-size:18px">${F(e)}</b></div><div class="card"><div class="mut">Savings plan</div><b style="font-size:18px">${F(S.cats.find(c=>c.id=='sav')?.a)}</b></div></div>
<div class="grid g3" style="margin-bottom:12px">${[['survive','🧮','Survival Calc'],['analytics','📊','Analytics'],['savings','🐷','Savings'],['ai','🤖','Ask Cash AI']].map(x=>`<button class="b2" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}</div>
<div class="grid g2"><div class="card"><h3>Where your money goes</h3><br>${dn()}</div><div class="card"><h3>Insights for you</h3><br>${insights().map(i=>`<p style="margin:0 0 10px">${i}</p>`).join('')}</div>
<div class="card"><div class="row sp"><h3>Recent transactions</h3><button class="b2 sm" onclick="go('tx')">See all</button></div>${[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,5).map(txRow).join('')||'<p class="mut">No transactions yet.</p>'}</div>
<div class="card"><div class="row sp"><h3>Savings goals</h3><button class="b2 sm" onclick="go('savings')">Manage</button></div><br>${S.goals.map(g=>`<div style="margin-bottom:12px"><div class="row sp"><b>${g.n}</b><span class="mut">${Math.round(pct(g.s,g.t))}%</span></div><div class="bar"><i style="width:${pct(g.s,g.t)}%"></i></div></div>`).join('')||'<p class="mut">No goals yet.</p>'}</div></div>`};
const txRow=t=>`<div class="tx"><div class="ic">${cat(t.c).i}</div><div style="flex:1;min-width:0"><b>${t.n}</b><div class="mut">${cat(t.c).n} · ${t.d}${t.note?' · '+t.note:''}</div></div><b>−${F(t.a)}</b></div>`;
let tf={q:'',c:'',p:'all'};
P.tx=()=>{let l=[...S.tx].filter(t=>(!tf.q||t.n.toLowerCase().includes(tf.q.toLowerCase())||t.note.toLowerCase().includes(tf.q.toLowerCase()))&&(!tf.c||t.c==tf.c)&&(tf.p=='all'||t.d>=off(-tf.p))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
return`<div class="row sp"><h2>Transactions</h2><button class="b" onclick="addTx()">+ Add expense</button></div><div class="card"><div class="grid g3" style="margin-bottom:6px"><input id="q" placeholder="🔍 Search…" value="${tf.q}" oninput="tf.q=this.value;list()"><select onchange="tf.c=this.value;list()"><option value="">All categories</option>${catOpts().map(o=>`<option value="${o[0]}" ${tf.c==o[0]?'selected':''}>${o[1]}</option>`)}</select><select onchange="tf.p=this.value;list()">${[['all','All time'],[0,'Today'],[6,'Last 7 days'],[29,'Last 30 days']].map(o=>`<option value="${o[0]}" ${tf.p==o[0]?'selected':''}>${o[1]}</option>`)}</select></div><div id="tl"></div></div>`};
function list(){const el=$('#tl');if(!el)return;let l=[...S.tx].filter(t=>(!tf.q||(t.n+t.note).toLowerCase().includes(tf.q.toLowerCase()))&&(!tf.c||t.c==tf.c)&&(tf.p=='all'||t.d>=off(-tf.p))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
const tot=l.reduce((a,b)=>a+b.a,0);el.innerHTML=`<div class="mut" style="margin:6px 0">${l.length} items · total ${F(tot)}</div>`+(l.map(t=>`<div class="tx"><div class="ic">${cat(t.c).i}</div><div style="flex:1;min-width:0"><b>${t.n}</b><div class="mut">${cat(t.c).n} · ${t.d}${t.note?' · '+t.note:''}</div></div><div style="text-align:right"><b>−${F(t.a)}</b><div><button class="b2 sm" onclick="editTx(${t.id})">✏️</button> <button class="b2 sm" onclick="delTx(${t.id})">🗑️</button></div></div></div>`).join('')||'<p class="mut">No matching transactions.</p>')}
const txForm=t=>[{k:'n',l:'Expense name',v:t?.n},{k:'a',l:'Amount (Rp)',t:'number',v:t?.a},{k:'c',l:'Category',o:catOpts(),v:t?.c||'food'},{k:'d',l:'Date',t:'date',v:t?.d||off(0)},{k:'note',l:'Notes (optional)',v:t?.note}];
function addTx(){form('Add expense',txForm(),v=>{if(!v.n.trim()||N(v.a)<=0)return toast('Enter a name and an amount above 0'),false;S.tx.push({id:Date.now(),n:v.n.trim(),a:N(v.a),c:v.c,d:v.d||off(0),note:v.note});save();render();toast('Expense added')})}
function editTx(id){const t=S.tx.find(x=>x.id==id);form('Edit expense',txForm(t),v=>{if(!v.n.trim()||N(v.a)<=0)return toast('Enter a name and an amount above 0'),false;Object.assign(t,{n:v.n.trim(),a:N(v.a),c:v.c,d:v.d,note:v.note});save();render();toast('Updated')})}
function delTx(id){S.tx=S.tx.filter(x=>x.id!=id);save();render();toast('Deleted – balance restored')}
P.budget=()=>{const ta=totAlloc(),over=ta>S.allow;return`<div class="row sp"><h2>Budget Planner</h2><button class="b" onclick="addCat()">+ Category</button></div>
<div class="card ${over?'':'hero'}" style="${over?'border-color:var(--r)':''}"><div class="row sp"><span>Allocated <b>${F(ta)}</b> of ${F(S.allow)}</span><b class="${over?'er':''}">${over?'⚠️ Over by '+F(ta-S.allow):'Unallocated '+F(S.allow-ta)}</b></div><div class="bar" style="margin-top:8px"><i style="width:${pct(ta,S.allow)}%;${over?'background:var(--r)':''}"></i></div></div><br>
${S.cats.map((c,i)=>{const s=c.id=='sav'?0:sp(c.id),o=s>c.a;return`<div class="card" style="margin-bottom:10px"><div class="row sp"><div class="row"><div class="ic">${c.i}</div><div><b>${c.n}</b><div class="mut">${Math.round(c.a/S.allow*100)}% of allowance</div></div></div><div class="row"><button class="b2 sm" onclick="editCat('${c.id}')">✏️ Edit</button>${c.id!='sav'?`<button class="b2 sm" onclick="delCat('${c.id}')">🗑️</button>`:''}</div></div>
<div class="row sp" style="margin:10px 0 6px"><span>Budget <b>${F(c.a)}</b></span>${c.id=='sav'?'<span class="mut">Protected target</span>':`<span class="${o?'er':''}">Spent ${F(s)} · ${o?'over by '+F(s-c.a):'left '+F(c.a-s)}</span>`}</div>
<div class="bar"><i style="width:${c.id=='sav'?100:pct(s,c.a)}%;background:${o?'var(--r)':s>c.a*.8?'var(--w)':c.id=='sav'?'var(--g)':'var(--pri)'}"></i></div></div>`}).join('')}`};
function addCat(){form('New category',[{k:'n',l:'Name'},{k:'i',l:'Emoji icon',v:'💸'},{k:'a',l:'Allocation (Rp)',t:'number'}],v=>{if(!v.n.trim())return toast('Enter a name'),false;S.cats.splice(S.cats.length-1,0,{id:'c'+Date.now(),n:v.n.trim(),i:v.i||'💸',a:N(v.a)});save();render()})}
function editCat(id){const c=S.cats.find(x=>x.id==id);form('Edit '+c.n,[{k:'n',l:'Name',v:c.n},{k:'i',l:'Emoji',v:c.i},{k:'a',l:id=='sav'?'Savings target (Rp)':'Allocation (Rp)',t:'number',v:c.a}],v=>{Object.assign(c,{n:v.n||c.n,i:v.i||c.i,a:N(v.a)});save();render()})}
function delCat(id){if(!confirm('Delete this category? Its transactions will show as “Other”.'))return;S.cats=S.cats.filter(c=>c.id!=id);save();render()}
let sv={};

<div class="card"><h3>Budget vs actual</h3><br>${it.map(x=>`<div style="margin-bottom:12px"><div class="row sp"><span>${x.c.i} ${x.c.n}</span><span class="${x.s>x.c.a?'er':'mut'}">${F(x.s)} / ${F(x.c.a)}</span></div><div class="bar" style="margin-bottom:3px"><i style="width:${pct(x.c.a,Math.max(x.c.a,x.s))}%;background:var(--line);box-shadow:inset 0 0 0 1px var(--mut)"></i></div><div class="bar"><i style="width:${pct(x.s,Math.max(x.c.a,x.s))}%;background:${x.s>x.c.a?'var(--r)':'var(--y)'}"></i></div></div>`).join('')}</div><br><div class="card"><h3>Insights</h3><br>${insights().map(i=>`<p style="margin:0 0 8px">${i}</p>`).join('')}</div>`};

function reply(q){const l=q.toLowerCase(),m=q.replace(/\./g,'').match(/(\d[\d]*)\s*(k|rb|ribu)?/i),amt=m?parseInt(m[1])*(m[2]?1000:1):0,r=rem(),d=days();
if(/afford|can i spend|buy|beli/.test(l)&&amt>=1000){const a=r-amt;return a<0?`That would put you ${F(-a)} below zero. Better to skip or wait for your next allowance.`:`Your balance is ${F(r)}. After spending ${F(amt)} you’d have ${F(a)}, about ${F(a/d)} per day for ${d} days.\n${a/d<daily()*.7?'That cuts your daily budget quite a bit, so make sure essentials are covered first.':'That looks manageable if essentials are already covered.'}`}
if(/per day|daily|how much should/.test(l))return`You have ${F(r)} for ${d} days, so about ${F(daily())} per day. After protected savings (${F(S.prot)}) and fixed costs (${F(S.fixed)}) it’s ${F(Math.max(0,(r-S.prot-S.fixed)/d))}/day.`;
if(/most|highest|where/.test(l)){const t=spCats().map(c=>[c,sp(c.id)]).sort((a,b)=>b[1]-a[1])[0];return`Your biggest category is ${t[0].i} ${t[0].n} at ${F(t[1])} (${Math.round(t[1]/spent()*100)}% of spending).`}
if(/save|saving|reduce/.test(l)){const o=spCats().find(c=>sp(c.id)>c.a),t=spCats().sort((a,b)=>sp(b.id)-sp(a.id))[0];return`Try this:\n• ${o?o.n+' is over budget – trim it for the next days':'Trim '+t.n+' by 10% (≈'+F(sp(t.id)*.1)+')'}\n• Cook staples at the kos and use Bikun when you can\n• Move your savings aside early in the month`}
return`I can help with: affordability (“Can I spend Rp100.000?”), your daily limit, top spending category, or saving tips. Right now you have ${F(r)} left for ${d} days.`}
